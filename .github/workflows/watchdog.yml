name: watchdog
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      MSG_IDS: ${{ secrets.STATUS_MSG_IDS }}   # comma-separated: one per monitored laptop
      OFFLINE_AFTER_MIN: 15
    steps:
      - run: |
          IFS=',' read -ra IDS <<< "$MSG_IDS"
          for MSG_ID in "${IDS[@]}"; do
            MSG_ID=$(echo "$MSG_ID" | xargs)  # trim whitespace
            msg=$(curl -sf "$WEBHOOK/messages/$MSG_ID")
            content=$(jq -r .content <<<"$msg")
            seen=$(jq -r '.edited_timestamp // .timestamp' <<<"$msg")
            age=$(( ( $(date +%s) - $(date -d "$seen" +%s) ) / 60 ))
            echo "[$MSG_ID] last seen $seen ($age min ago): $content"
            [ "$age" -lt "$OFFLINE_AFTER_MIN" ] && continue
            [[ "$content" == 🔴* ]] && { echo "[$MSG_ID] already alerted"; continue; }
            seen_local=$(date -d "$seen" +'%Y-%m-%d %H:%M UTC')
            name=$(echo "$content" | awk '{print $2}')  # 🟢/🟠 <hostname> ...
            curl -sf -X PATCH -H 'Content-Type: application/json' \
              -d "$(jq -cn --arg c "🔴 OFFLINE — last seen $seen_local" '{content:$c}')" \
              "$WEBHOOK/messages/$MSG_ID" >/dev/null
            curl -sf -H 'Content-Type: application/json' \
              -d "$(jq -cn --arg c "@everyone 🔴 $name OFFLINE — no heartbeat for $age min (last seen $seen_local)" '{content:$c}')" \
              "$WEBHOOK" >/dev/null
          done
